spring:
  application:
    name: btrepolens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/btrepolens}
    username: ${DB_USERNAME:btrepolens}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    model:
      chat: none
      embedding: none
    openai:
      api-key: ${AI_API_KEY:unused}
      chat:
        options:
          model: ${AI_MODEL:gpt-4.1-mini}
server:
  address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
github:
  base-url: ${GITHUB_BASE_URL:https://api.github.com}
  token: ${GITHUB_TOKEN:}
  connect-timeout: 5s
  read-timeout: 15s
